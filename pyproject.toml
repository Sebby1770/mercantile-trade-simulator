[project]
name = "mercantile-trade-simulator"
version = "2.0.0"
description = "Captain’s-chart trading game: sail eight ports, weather storms, and hunt arbitrage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
